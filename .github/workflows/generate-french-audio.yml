name: Generate free French page audio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-french-page-audio
  cancel-in-progress: false

jobs:
  generate:
    name: Generate French MP3s with Piper (no API key)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Piper
        run: |
          python -m pip install --upgrade pip
          python -m pip install "piper-tts==1.8.0"

      - name: Install MP3 encoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Test the generator offline
        run: python tests/test_piper_speech.py

      - name: Generate the audition and every page
        run: python scripts/generate_piper_speech.py

      - name: Commit generated MP3s and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/speech/fr-FR
          if git diff --cached --quiet; then
            echo "French audio files are already up to date."
            exit 0
          fi
          git commit -m "Generate free Piper French page audio"
          git push origin HEAD:main
