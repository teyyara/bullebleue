name: Website quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, interaction and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run structural validator
        run: python tests/validate_site.py

      - name: Run JavaScript syntax and interaction tests
        run: |
          node --check script.js
          node --check tests/test_menu.js
          node tests/test_menu.js

      - name: Install browser-test dependency
        run: python -m pip install "playwright==1.57.0"

      - name: Install Chromium, Firefox and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run responsive checks — Chromium
        env:
          BROWSER_ENGINE: chromium
        run: python tests/test_browser.py

      - name: Run responsive checks — Firefox
        env:
          BROWSER_ENGINE: firefox
        run: python tests/test_browser.py

      - name: Run responsive checks — WebKit
        env:
          BROWSER_ENGINE: webkit
        run: python tests/test_browser.py

      - name: Preserve Chromium visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulle-bleue-loop026-visual-review
          path: artifacts/loop026-browser-chromium/
          if-no-files-found: ignore
          retention-days: 7
